# NCSC Cyber Drill — sandbox provisioning
#
# Deliberately dependency-free for the first build: no package installs, no
# external Ansible roles, no downloads. If this playbook fails, the cause is the
# platform or the topology — not the sandbox's internet access or a missing
# Galaxy role. That makes the first build a clean test.
#
# Once a plain build is known good, add roles (see requirements.yml) and package
# installs one at a time.
#
# Host groups are generated by the platform from topology.yml: every node is in
# `hosts` or `routers`, and each node is also addressable by its own name.

- name: Mark every sandbox node
  hosts: hosts
  become: yes
  gather_facts: yes
  tasks:
    - name: Write a build marker
      copy:
        dest: /etc/ncsc-drill-build
        content: |
          NCSC Cyber Drill — demo sandbox
          node: {{ inventory_hostname }}
        owner: root
        group: root
        mode: '0644'

- name: Set up the server
  hosts: server
  become: yes
  tasks:
    - name: Place the challenge flag
      copy:
        dest: /root/flag.txt
        content: "NCSC{cr0ss-network-r3ach}\n"
        owner: root
        group: root
        mode: '0600'

    # The flag is root-only by design: reading it is the exercise. That needs an
    # account on this host, and server-switch is accessible_by_user: False, so the
    # platform never creates one here. Same throwaway lab credential as the client.
    - name: Create the participant account
      user:
        name: participant
        password: "{{ 'ChangeMe123' | password_hash('sha512') }}"
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes

    # Competition flags, for examples/competition/training.json. The values come
    # from the APG variables declared in variables.yml, so every sandbox gets a
    # different pair and a flag copied between competitors does not score. The
    # demo exercise ignores these files, and this exercise ignores /root/flag.txt.
    - name: Round 3 flag, readable by the participant
      copy:
        dest: /home/participant/round3.txt
        content: "{{ round3_flag }}\n"
        owner: participant
        group: participant
        mode: '0644'

    - name: Round 4 flag, root only
      copy:
        dest: /root/round4.txt
        content: "{{ round4_flag }}\n"
        owner: root
        group: root
        mode: '0600'

    # Ubuntu cloud images ship PasswordAuthentication no, in
    # /etc/ssh/sshd_config.d/60-cloudimg-settings.conf. sshd takes the FIRST
    # value it reads for a keyword, and Include globs in lexical order, so the
    # override has to sort before 60-. A 99- file is read last and does nothing.
    - name: Allow password SSH for the lab account
      copy:
        dest: /etc/ssh/sshd_config.d/01-lab.conf
        content: "PasswordAuthentication yes\n"
        owner: root
        group: root
        mode: '0644'
      notify: restart ssh

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted

- name: Set up the client
  hosts: client
  become: yes
  tasks:
    # Lab credential, intentionally known — participants log in with it.
    # It is not a secret, but never reuse this pattern outside a throwaway
    # sandbox, and change it before any real drill.
    - name: Create the participant account
      user:
        name: participant
        password: "{{ 'ChangeMe123' | password_hash('sha512') }}"
        groups: sudo
        append: yes
        shell: /bin/bash
        create_home: yes

    # Same as the server, and for the same first-value-wins reason: the browser
    # console logs in over SSH and Guacamole sends the lab password itself. If
    # sshd refuses password auth the tunnel closes the moment it is sent.
    - name: Allow password SSH for the lab account
      copy:
        dest: /etc/ssh/sshd_config.d/01-lab.conf
        content: "PasswordAuthentication yes\n"
        owner: root
        group: root
        mode: '0644'
      notify: restart ssh

  handlers:
    - name: restart ssh
      service:
        name: ssh
        state: restarted
