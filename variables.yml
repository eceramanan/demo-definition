# APG variables — OPTIONAL.
#
# These generate a different value per sandbox, so each participant gets a
# different answer and answers cannot be shared between them. Required only for
# adaptive trainings; a plain linear training works without this file.
#
# Leave this as-is for the first build. Turn it on only once a plain linear
# training runs end to end, and remember that using a variable here means
# referencing it from both playbook.yml and training.json.
#
# Reference:
# https://docs.platform.cyberrange.cz/user-guide-advanced/sandboxes/apg-variables/
#
# Example — the vendor demo's variables:
#
# telnet_port:
#     type: port
#     min: 1500
#
# alice_flag:
#     type: text
#
# root_flag:
#     type: text

# Not an empty file, and no longer an empty mapping. A comments-only file loads
# as None and crashes manage_answers.py with
#   TypeError: 'NoneType' object is not iterable
# (generator/var_generator.py, `for var in variables`).
#
# These two are consumed by examples/competition/training.json, whose rounds 3
# and 4 carry a null answer and name the variable instead. Both halves are
# required: the platform refuses a training definition naming a variable the
# sandbox definition does not declare, and refuses a level that has both a
# static answer and a variable one.
#
# APG generates a different value per sandbox, which is what stops a flag being
# passed between competitors. provisioning/playbook.yml writes each value onto
# the server, so the file and the expected answer come from the same source.

round3_flag:
    type: text

round4_flag:
    type: text
